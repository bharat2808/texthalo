<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#151515;color:#ddd;font:16px system-ui}h1{text-align:center;font-size:18px;height:40px}.pages{display:flex;justify-content:center;gap:3vw;margin-top:30px}img{width:38vw;height:68vh}footer{text-align:center;margin:30px}nav{position:fixed;bottom:10px;left:10px}aside{position:fixed;right:0;top:80px;width:40vw;height:70vh;background:#383838;padding:20px;box-sizing:border-box}[hidden]{display:none}</style></head><body>
<h1>TextHalo reader test book</h1><div class="pages"><img id="left" alt="Left book page"><img id="right" alt="Right book page"></div><footer><span id="progress">Page 8 of 134</span></footer><nav><button aria-label="Previous page">Previous page</button><button aria-label="Next page">Next page</button><button id="settings">Settings</button></nav><aside role="menu" hidden><h2>Reader settings</h2><button id="close">Close</button></aside>
<script>
let page=8;function render(){document.querySelector('#progress').textContent=`Page ${page} of 134`;for(const id of ['left','right']){let lines=Array.from({length:12},(_,i)=>`<text x="25" y="${50+i*32}" fill="#ddd" font-size="18">TextHalo page ${page}, ${id} line ${i+1}: local reading test.</text>`).join('');document.getElementById(id).src='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="500" height="700"><rect width="100%" height="100%" fill="#151515"/>${lines}</svg>`);}}
document.querySelector('[aria-label="Next page"]').onclick=()=>{page++;render()};document.querySelector('[aria-label="Previous page"]').onclick=()=>{page--;render()};document.querySelector('#settings').onclick=()=>document.querySelector('aside').hidden=false;document.querySelector('#close').onclick=()=>document.querySelector('aside').hidden=true;render();
</script></body></html>
